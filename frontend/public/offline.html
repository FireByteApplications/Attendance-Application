<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111a34" />
    <title>Offline | JRFB Attendance</title>
    <style>
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; box-sizing: border-box; padding: calc(1.5rem + env(safe-area-inset-top, 0px)) 1.5rem calc(1.5rem + env(safe-area-inset-bottom, 0px)); color: #17232e; background: #f3f5f7; font: 1rem/1.5 system-ui, sans-serif; }
      main { width: min(100%, 30rem); padding: 2rem; border-radius: 0.85rem; background: white; box-shadow: 0 8px 28px rgb(19 35 48 / 8%); }
      h1 { margin-top: 0; }
      a { display: inline-block; margin-top: 0.5rem; padding: 0.7rem 1rem; border-radius: 0.4rem; background: #111a34; color: white; text-decoration: none; }
      a:focus-visible { outline: 3px solid #f9b233; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Attendance submissions and admin actions need an internet connection. Reconnect, then try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>

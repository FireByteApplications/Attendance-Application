version: "3.8"

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    command: npm run dev
    volumes:
      - ./api:/usr/src/app:cached
      - api_node_modules:/usr/src/app/node_modules
    env_file:
      - ./api/.env
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: npm run dev
    volumes:
      - ./frontend:/usr/src/app:cached
      - frontend_node_modules:/usr/src/app/node_modules
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_HOST=0.0.0.0
    depends_on:
      - api

volumes:
  api_node_modules:
  frontend_node_modules:
